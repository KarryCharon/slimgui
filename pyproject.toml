[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind==2.12.0", "typing-extensions"]
build-backend = "scikit_build_core.build"

[project]
name = "slimgui"
version = "0.6.0"
description = "Python Dear ImGui bindings"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Janne Hellsten", email = "jjhellst@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Documentation = "https://nurpax.github.io/slimgui/"
Repository = "https://github.com/nurpax/slimgui"

[tool.slimgui]
imgui_version = "1.92.4"

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "litgen>=0.22.0",
    "markdown>=3.10",
    "toml>=0.10",
    "requests>=2.31",
    "build>=1.4.4"
]

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

# Editable install: redirect imports to build dir
editable.mode = "redirect"

# 单配置生成器 (NMake / Ninja) 用 cmake.build-type 即可生效;
# 多配置生成器 (Visual Studio) 在 configure 阶段 CMAKE_BUILD_TYPE 不起作用,
# 必须在 build 阶段传 --config Release. cmake.define 在 configure 时把变量
# 强制写入 cache, scikit-build-core build 阶段会据此选择 --config 参数,
# 同时也覆盖 CMakeLists.txt 里通过 `if(NOT CMAKE_BUILD_TYPE)` 兜底的逻辑.
[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1
skip = ["cp38-*", "cp39-*"]
archs = ["auto64"]          # Only target 64 bit architectures

# Run pytest to ensure that the package was correctly built
# test-command = "pytest {project}/tests"
# test-requires = "pytest"

# Don't test Python 3.8 wheels on macOS/arm64
test-skip="cp*-macosx_*:arm64"

# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"
